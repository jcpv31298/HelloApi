name: "CodeQL Security Scan"

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      # ⬇️ IMPORTANTE: Autobuild SIN steps manuales de build
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
          output: sarif-results
          upload: False

      - name: Check CodeQL results and fail if vulnerabilities found
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 SECURITY SCAN: Checking for CodeQL vulnerabilities..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          SARIF_FILES=$(find sarif-results -name "*.sarif" -type f 2>/dev/null || echo "")

          if [ -z "$SARIF_FILES" ]; then
            echo "⚠️  No SARIF files found"
            exit 0
          fi

          echo "📄 Found SARIF files:"
          for file in $SARIF_FILES; do
            echo "   • $file"
          done
          echo ""

          echo "🔧 Installing jq..."
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y jq > /dev/null 2>&1
          echo "   ✓ jq installed"
          echo ""

          TOTAL_CRITICAL=0
          TOTAL_HIGH=0
          TOTAL_MEDIUM=0
          TOTAL_LOW=0

          for file in $SARIF_FILES; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 Analyzing: $file"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            ERRORS=$(jq '[.runs[].results[] | select(.level == "error")] | length' "$file" 2>/dev/null || echo "0")
            WARNINGS=$(jq '[.runs[].results[] | select(.level == "warning")] | length' "$file" 2>/dev/null || echo "0")
            NOTES=$(jq '[.runs[].results[] | select(.level == "note")] | length' "$file" 2>/dev/null || echo "0")
            
            echo "  📈 Summary:"
            echo "     • Errors (High/Critical): $ERRORS"
            echo "     • Warnings (Medium):      $WARNINGS"
            echo "     • Notes (Low):            $NOTES"
            
            if [ "$ERRORS" -gt 0 ] || [ "$WARNINGS" -gt 0 ]; then
              echo ""
              echo "  🚨 Vulnerabilities found:"
              echo ""
              jq -r '.runs[].results[] | 
                "     [\(.level | ascii_upcase)] \(.message.text)\n" +
                "     📍 \(.locations[0].physicalLocation.artifactLocation.uri // "unknown"):\(.locations[0].physicalLocation.region.startLine // "?")\n" +
                "     🔗 Rule: \(.ruleId // "unknown")\n"
              ' "$file" 2>/dev/null || true
            fi
            
            TOTAL_CRITICAL=$((TOTAL_CRITICAL + ERRORS))
            TOTAL_HIGH=$((TOTAL_HIGH + ERRORS))
            TOTAL_MEDIUM=$((TOTAL_MEDIUM + WARNINGS))
            TOTAL_LOW=$((TOTAL_LOW + NOTES))
            
            echo ""
          done

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 FINAL SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Total vulnerabilities:"
            echo "    🔴 Critical/High:  $TOTAL_HIGH"
          echo "    🟠 Medium:         $TOTAL_MEDIUM"
          echo "    🟡 Low:            $TOTAL_LOW"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$TOTAL_HIGH" -gt 0 ]; then
            echo ""
            echo "❌ ════════════════════════════════════════════════════"
            echo "❌  BUILD FAILED: Security vulnerabilities detected"
            echo "❌ ════════════════════════════════════════════════════"
            echo ""
            echo "   Found $TOTAL_HIGH High/Critical vulnerabilities!"
            echo ""
            echo "   🚫 This code cannot be merged."
            echo ""
            echo "   📋 Fix the issues above and commit again."
            echo "   📍 View details: Security → Code scanning"
            echo ""
            exit 1
          fi

          if [ "$TOTAL_MEDIUM" -gt 0 ]; then
            echo ""
            echo "⚠️  WARNING: $TOTAL_MEDIUM Medium severity issues"
            echo "   Consider fixing when possible."
            echo ""
          fi

          echo ""
          echo "✅ ════════════════════════════════════════════════════"
          echo "✅  SECURITY SCAN PASSED"
          echo "✅ ════════════════════════════════════════════════════"
          echo ""

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
