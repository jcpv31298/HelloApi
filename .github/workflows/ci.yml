name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:
  
jobs:
  build-and-test:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout Code
         uses: actions/checkout@v4

       - name: Setup .NET 8
         uses: actions/setup-dotnet@v4
         with:
           dotnet-version: '8.0.x'

       - name: Restore dependencies
         run: dotnet Restore HelloApi.sln

       - name: Build
         run: dotnet build HelloApi.sln --configuration Release --no-restore

       - name: Run Tests
         run: dotnet test HelloApi.sln --configuration Release --no-build --verbosity normal